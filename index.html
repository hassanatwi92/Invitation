<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hassan & Maha</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Georgia', serif;
    color: white;
    text-align: center;
    background-color: #222;
    overflow: hidden;
}

body {
    background-size: cover;
    background-position: center;
    transition: background-image 1.5s ease-in-out;
}

/* ===== النصوص متجاوبة ===== */
h1 {
    font-size: clamp(24px, 6vw, 50px);
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}

h2 {
    font-size: clamp(18px, 4vw, 28px);
    margin-top: 20px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
}

p {
    font-size: clamp(14px, 3vw, 18px);
    line-height: 1.6;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
}

/* ===== الأزرار ===== */
button {
    background: rgba(0,0,0,0.5);
    border: 1px solid white;
    color: white;
    padding: 15px 35px;
    font-size: 20px;
    border-radius: 30px;
    cursor: pointer;
    z-index: 2;
    position: relative;
}

.nav-buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
    padding: 10px;
    position: relative;
    z-index: 2;
}

/* ===== المجموعات ===== */
.radio-group {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
}

textarea {
    width: 80%;
    padding: 10px;
    border-radius: 8px;
    border: none;
    margin-top: 10px;
    font-size: 16px;
}

/* ===== الصور متجاوبة ===== */
.main-logo, #slides img {
    max-width: 90%;
    max-height: 50vh;
    width: auto;
    height: auto;
    display: block;
    margin: 0 auto;
    position: relative;
    z-index: 2; /* فوق overlay */
}

/* ===== overlay ===== */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 0;
    pointer-events: none;
}

/* ===== شاشات ===== */
.screen {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: white;
    text-align: center;
    padding: 10px;
}

.hidden { display: none; }

/* ===== العد التنازلي ===== */
#countdown {
    display: flex;
    gap: 20px;
    font-size: 1.5rem; /* أكبر حجم */
    margin-bottom: 20px;
    position: relative;
    z-index: 2; 
}
#countdown div {
    text-align: center;
}
#countdown div div {
    font-size: 2.5rem; /* أكبر رقم */
}

/* ===== Responsive إضافي ===== */
@media (max-width: 480px) {
    button {
        padding: 12px 25px;
        font-size: 18px;
    }
    .radio-group {
        flex-direction: column;
    }
    textarea {
        width: 90%;
    }
}
</style>
</head>

<body>

<!-- الصفحة الأولى -->
<div id="opening" class="screen">
    <img src="logo.png" class="main-logo">
    
    <div id="countdown">
        <div><div id="days">0</div>Days</div>
        <div><div id="hours">0</div>Hours</div>
        <div><div id="minutes">0</div>Minutes</div>
        <div><div id="seconds">0</div>Seconds</div>
    </div>

    <button onclick="startSite()">START</button>
</div>

<!-- الصفحة الثانية -->
<div id="content" class="screen hidden">
    <div class="overlay"></div>
    <div style="position:relative; z-index:2;">
        <h2>"Therefore what God has joined together, let no one separate."</h2>
        <p>Together with their families</p>
        <div style="display:flex; justify-content:center; gap:50px; flex-wrap: wrap; font-size:1.2rem;">
            <div><div style="font-size:1.5rem;">Kassem Atwi</div>Family</div>
            <div><div style="font-size:1.5rem;">Bilal Al Khayat</div>Family</div>
        </div>
        <h1>Hassan & Maha</h1>
        <p>joyfully invite you to their wedding celebration</p>
    </div>
    <div class="nav-buttons">
        <button onclick="goOpening()">⏮ Prev</button>
        <button onclick="next()">Next ⏭</button>
    </div>
</div>

<!-- الشرائح -->
<div id="slides" class="screen hidden">
    <div class="overlay"></div>
    <div id="textSlides" style="position:relative; z-index:2;"></div>
    <div class="nav-buttons">
        <button onclick="prevSlide()">⏮ Prev</button>
        <button onclick="nextSlide()">Next ⏭</button>
    </div>
</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* ===== العد التنازلي ===== */
const weddingDate = new Date("2026-04-26T20:00:00").getTime();
setInterval(() => {
    const now = new Date().getTime();
    const d = weddingDate - now;
    if(d > 0){
        days.innerHTML = Math.floor(d/(1000*60*60*24));
        hours.innerHTML = Math.floor((d%(1000*60*60*24))/(1000*60*60));
        minutes.innerHTML = Math.floor((d%(1000*60*60))/(1000*60));
        seconds.innerHTML = Math.floor((d%(1000*60))/1000);
    }
}, 1000);

/* ===== الخلفيات ===== */
const images = ["bg1.jpg","bg2.jpg","bg3.jpg","bg4.jpg","bg5.jpg"];
let imgIndex = 0;
function changeBackground(){
    document.body.style.backgroundImage = `url(${images[imgIndex]})`;
    imgIndex = (imgIndex + 1) % images.length;
}
changeBackground(); // أول صورة فوراً بدون فلاش أسود
setInterval(changeBackground, 4000);

/* ===== الشرائح ===== */
const slidesContent = [
`<h2>Wedding Celebration</h2>
<div style="font-size:60px; margin-bottom:10px;">🕖</div>
<p>Sunday, 26/04/2026<br>8:00 PM<br>La Salle Venue - Saida</p>
<button onclick="window.open('https://maps.app.goo.gl/CrUSkbyqZCosc2dJ9')">Open Map</button>`,

`<div style="font-size:60px; margin-bottom:10px;">🎁</div>
<h2>Gift Registry</h2>
<p>Whish Money: 76/059770<br>IBL Acc.: 0083910802470011</p>`,

`<img src="logo.png" alt="H & M Logo" style="width:200px; background:transparent;">
<h2>RSVP</h2>
<p>Will you be joining us?</p>
<div class="radio-group">
<label><input type="radio" name="attend" value="Yes" onchange="showGuestOptions(true)"> Yes</label>
<label><input type="radio" name="attend" value="No" onchange="showGuestOptions(false)"> No</label>
</div>
<div id="guestOptions" class="hidden">
<p>Guests attending:</p>
<div class="radio-group">
<label><input type="radio" name="guestOption" value="1"> 1</label>
<label><input type="radio" name="guestOption" value="2"> 2</label>
</div>
</div>
<textarea id="msg" placeholder="Message (optional)"></textarea><br>
<button onclick="sendWhatsApp()">Submit</button>`
];

let indexSlide = 0;
const textSlides = document.getElementById("textSlides");

function startSite(){
    opening.classList.add("hidden");
    content.classList.remove("hidden");
    music.play().catch(()=>{});
}

function next(){
    content.classList.add("hidden");
    slides.classList.remove("hidden");
    textSlides.innerHTML = slidesContent[indexSlide];
}

function prev(){
    content.classList.add("hidden");
    opening.classList.remove("hidden");
}

function nextSlide(){
    if(indexSlide < slidesContent.length-1){
        indexSlide++;
        textSlides.innerHTML = slidesContent[indexSlide];
    }
}

function prevSlide(){
    if(indexSlide > 0){
        indexSlide--;
        textSlides.innerHTML = slidesContent[indexSlide];
    } else {
        slides.classList.add("hidden");
        content.classList.remove("hidden");
    }
}

function showGuestOptions(show){
    const g = document.getElementById("guestOptions");
    document.querySelectorAll('input[name="guestOption"]').forEach(r => r.checked = false);
    show ? g.classList.remove("hidden") : g.classList.add("hidden");
}

function sendWhatsApp(){
    const attend = document.querySelector('input[name="attend"]:checked')?.value || "";
    const guest = document.querySelector('input[name="guestOption"]:checked')?.value || "";
    const msg = document.getElementById("msg").value;
    const text = `RSVP\nAttending: ${attend}\nGuests: ${guest}\nMessage: ${msg}`;
    window.open(`https://wa.me/96176059770?text=${encodeURIComponent(text)}`);
    textSlides.innerHTML = "<h1>Thank you!</h1><p>We can't wait to celebrate with you</p><h1>🎉</h1>";
}

function goOpening(){
    document.getElementById("content").classList.add("hidden");
    document.getElementById("opening").classList.remove("hidden");
}
</script>

</body>
</html>
